[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinal-blip2-vqa"
version = "0.1.0"
description = "Auditable BLIP-2 adaptation and lesion-presence evaluation for retinal VQA"
requires-python = ">=3.8,<3.12"
dependencies = [
  "torch==2.4.1", "transformers==4.46.3", "accelerate==0.34.2",
  "numpy==1.24.4", "Pillow==10.4.0", "PyYAML==6.0.2",
  "tokenizers==0.20.3", "safetensors==0.5.3"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
figures = ["matplotlib==3.7.5"]

[project.scripts]
retinal-vqa = "retinal_blip2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
